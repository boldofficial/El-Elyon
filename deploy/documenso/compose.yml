name: el-elyon-signing
services:
  database:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: documenso
      POSTGRES_DB: documenso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U documenso -d documenso']
      interval: 10s
      timeout: 5s
      retries: 5
  documenso:
    image: documenso/documenso:v2.17.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: 3000
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/documenso
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
    ports:
      - '127.0.0.1:3002:3000'
    volumes:
      - ./cert.p12:/opt/documenso/cert.p12:ro
volumes:
  database:
